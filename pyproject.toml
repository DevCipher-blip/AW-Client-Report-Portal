[project]
name = "client-report-portal"
version = "1.1.0"
description = "Quarterly SACS and TCC client report generator (Flask + ReportLab)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
