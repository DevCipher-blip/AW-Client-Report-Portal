<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Report Portal · {{ firm_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='portal.css') }}">
<script src="{{ url_for('static', filename='portal.js') }}" defer></script>
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>

<aside id="sidebar">
  <div class="brand">
    <p class="brand-name">{{ firm_name }}</p>
    <p class="brand-tag">Client Report Portal</p>
  </div>
  <nav class="sidebar-nav" aria-label="Main">
    <ul class="nav-list">
      <li><a class="nav-link" href="#/" data-nav="dashboard">Dashboard</a></li>
      <li>
        <a class="nav-link" href="#/clients" data-nav="clients">Clients</a>
        <ul id="client-nav" class="client-nav"></ul>
      </li>
    </ul>
    <button type="button" class="btn btn-gold sidebar-add" data-action="new-client">Add client</button>
  </nav>
</aside>

<div id="main">
  <header class="topbar">
    <div>
      <h1 class="topbar-title" id="topbar-title">Dashboard</h1>
      <p class="topbar-sub" id="topbar-sub">Overview of all clients and reports</p>
    </div>
    <div class="topbar-actions" id="topbar-actions"></div>
  </header>
  <main id="content" tabindex="-1" aria-busy="true">
    <p class="state">Loading clients…</p>
  </main>
</div>

<dialog id="client-dialog" class="dialog" aria-labelledby="client-dialog-title">
  <form id="client-form" method="dialog" novalidate>
    <header class="dialog-header">
      <h2 class="dialog-title" id="client-dialog-title">Add client</h2>
      <button type="button" class="dialog-close" data-action="close-dialog" aria-label="Close">&times;</button>
    </header>
    <div class="dialog-body" id="client-form-body"></div>
    <p class="form-error" role="alert" hidden></p>
    <footer class="dialog-footer">
      <button type="button" class="btn btn-danger" data-action="delete-client" hidden>Delete client</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-outline" data-action="close-dialog">Cancel</button>
      <button type="submit" class="btn btn-primary">Save client</button>
    </footer>
  </form>
</dialog>

<dialog id="report-dialog" class="dialog dialog-wide" aria-labelledby="report-dialog-title">
  <form id="report-form" method="dialog" novalidate>
    <header class="dialog-header">
      <h2 class="dialog-title" id="report-dialog-title">New quarterly report</h2>
      <button type="button" class="dialog-close" data-action="close-dialog" aria-label="Close">&times;</button>
    </header>
    <div class="dialog-body" id="report-form-body"></div>
    <p class="form-error" role="alert" hidden></p>
    <footer class="dialog-footer">
      <span class="spacer"></span>
      <button type="button" class="btn btn-outline" data-action="close-dialog">Cancel</button>
      <button type="submit" class="btn btn-gold">Save report</button>
    </footer>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
